services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: troxa_live
      POSTGRES_USER: troxa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_live_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U troxa -d troxa_live"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8003:8000"
    env_file: backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=troxa_live
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media
    restart: unless-stopped

volumes:
  postgres_live_data:
